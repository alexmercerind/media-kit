import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_audio'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_audio'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}


task downloadDependencies(type: Exec)  {
    
        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        // Sources: https://github.com/alexmercerind/libmpv-build/releases
        def libmpvVersion = "v0.0.5"
        def filesToDownload = [
            ["url": "https://github.com/alexmercerind/libmpv-build/releases/download/${libmpvVersion}/libmpv_android_arm64-v8a_audio.jar", "sha256": "4524336a29eb2646e411d999212d3ab6c8dbe8d41b58fd64f7a85a1f4cee1007", "destination": file("$buildDir/${libmpvVersion}/libmpv_android_arm64-v8a_audio.jar")],
            ["url": "https://github.com/alexmercerind/libmpv-build/releases/download/${libmpvVersion}/libmpv_android_armeabi-v7a_audio.jar", "sha256": "7e4b5a88f33fd24efe5ab6d4d4bc927e2eee7060b324810ea9052bbaa7b3979f", "destination": file("$buildDir/${libmpvVersion}/libmpv_android_armeabi-v7a_audio.jar")],
            ["url": "https://github.com/alexmercerind/libmpv-build/releases/download/${libmpvVersion}/libmpv_android_x86_64_audio.jar", "sha256": "a19e5b4f91eb3339a84d2cc530c516c18d969025fa31f8921c0310c637bba182", "destination": file("$buildDir/${libmpvVersion}/libmpv_android_x86_64_audio.jar")],
            ["url": "https://github.com/alexmercerind/libmpv-build/releases/download/${libmpvVersion}/libmpv_android_x86_audio.jar", "sha256": "0a79eaa840bf0d25c31ec64538d2e16a19d3a7b9d7f50f266c5e93c6cb87eab4", "destination": file("$buildDir/${libmpvVersion}/libmpv_android_x86_audio.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination

            if (destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
               
            }

            copy {
                from destFile
                into outputDir
            }
        }
    
}

assemble.dependsOn(downloadDependencies)
