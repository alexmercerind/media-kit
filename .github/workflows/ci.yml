name: GitHub Actions

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'dart test --plain-name filter (empty runs the full suite)'
        required: false
        default: ''

jobs:
  media_kit-tests-windows:
    name: package:media_kit tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup libmpv for Windows
        run: |
          curl -L -o libmpv_windows_x64_audio.zip https://github.com/alexmercerind/libmpv-build/releases/download/v0.0.5/libmpv_windows_x64_audio.zip
          python -c "import hashlib,sys; h=hashlib.sha256(open('libmpv_windows_x64_audio.zip','rb').read()).hexdigest(); print(h); sys.exit(0 if h=='7e9094757807052ebe6662fe6c94b03c14de7c6d0c6762296437cbfe1a0758db' else 1)"
          cmake -E tar xf libmpv_windows_x64_audio.zip libmpv-2.dll
        shell: cmd

      - run: dart pub get
      - run: dart test ${{ inputs.test-filter != '' && format('--plain-name "{0}"', inputs.test-filter) || '' }}

  media_kit-tests-linux:
    name: package:media_kit tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: >
          sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
          dpkg-dev p7zip-full libasound2t64 libpulse0
      - name: Setup prebuilt libmpv (audio)
        run: |
          curl -sL -o libmpv_linux_x86_64_audio.zip https://github.com/alexmercerind/libmpv-build/releases/download/v0.0.5/libmpv_linux_x86_64_audio.zip
          echo "a9eb8e7c19f37a9fce477a232e6ecbcb0888ecb4658003ceb334f3f17ae97d00  libmpv_linux_x86_64_audio.zip" | sha256sum -c -
          mkdir -p mpv-native && unzip -q -o libmpv_linux_x86_64_audio.zip -d mpv-native
          echo "LIBMPV_LIBRARY_PATH=$PWD/mpv-native/lib/libmpv.so" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/mpv-native/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: dart pub get
      - run: dart test ${{ inputs.test-filter != '' && format('--plain-name "{0}"', inputs.test-filter) || '' }}

  media_kit-tests-macos:
    name: package:media_kit tests (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Setup prebuilt libmpv (audio)
        run: |
          mkdir -p test/ci/macos/libs
          curl -sL -o test/ci/macos/libs/libmpv_macos_universal_audio.zip https://github.com/alexmercerind/libmpv-build/releases/download/v0.0.5/libmpv_macos_universal_audio.zip
          echo "3b5db00234f4b1ffb659546b681d7eea66f0f0d2bd874ff3f96d9e3017ff1bfa  test/ci/macos/libs/libmpv_macos_universal_audio.zip" | shasum -a 256 -c -
          ditto -x -k test/ci/macos/libs/libmpv_macos_universal_audio.zip test/ci/macos/libs/
          echo "LIBMPV_LIBRARY_PATH=$PWD/test/ci/macos/libs/Mpv.xcframework/macos-arm64_x86_64/Mpv.framework/Mpv" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: dart pub get
      - run: dart test ${{ inputs.test-filter != '' && format('--plain-name "{0}"', inputs.test-filter) || '' }}

  media_kit-tests-web:
    name: package:media_kit tests (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: >
          sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
          mpv libmpv-dev dpkg-dev p7zip-full
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: rm -r test/src/player/native
      - run: dart pub get
      - run: dart test --platform chrome ${{ inputs.test-filter != '' && format('--plain-name "{0}"', inputs.test-filter) || '' }}

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --verbose
      - run: >
          cmake -E tar "cfv" "media_kit_test_win32_x64.7z" --format=7zip
          "build\windows\x64\runner\Release"
      - uses: actions/upload-artifact@v7
        with:
          name: media_kit_test_win32_x64
          path: media_kit_test/media_kit_test_win32_x64.7z
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_win32_x64.7z

  linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: >
          sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
          mpv libmpv-dev dpkg-dev p7zip-full
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build linux --verbose
      - run: 7z a media_kit_test_linux_x64.7z build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: media_kit_test_linux_x64
          path: media_kit_test/media_kit_test_linux_x64.7z
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_linux_x64.7z

  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build macos --verbose
      - run: >
          7z a media_kit_test_macos_universal.7z
          build/macos/Build/Products/Release/media_kit_test.app
      - uses: actions/upload-artifact@v7
        with:
          name: media_kit_test_macos_universal
          path: media_kit_test/media_kit_test_macos_universal.7z
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_macos_universal.7z

  ios:
    name: iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --verbose --no-codesign
      - run: 7z a media_kit_test_ios_arm64.7z build/ios/iphoneos/Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: media_kit_test_ios_arm64
          path: media_kit_test/media_kit_test_ios_arm64.7z
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_ios_arm64.7z

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build apk --split-per-abi --verbose
      - run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/media_kit_test_android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/media_kit_test_android-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/media_kit_test_android-x86_64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: media_kit_test_android-armeabi-v7a
          path: media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-armeabi-v7a.apk
      - uses: actions/upload-artifact@v7
        with:
          name: media_kit_test_android-arm64-v8a
          path: media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-arm64-v8a.apk
      - uses: actions/upload-artifact@v7
        with:
          name: media_kit_test_android-x86_64
          path: media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-x86_64.apk
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-armeabi-v7a.apk
            media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-arm64-v8a.apk
            media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-x86_64.apk

  build_web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Build Flutter Web WASM
        run: flutter build web --release --wasm

  optional-libs-windows:
    name: Windows (optional libs)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          "C:\Program Files\Git\usr\bin\sed.exe" -i "/media_kit_libs_/d" pubspec.yaml
          type pubspec.yaml
        shell: cmd
      - run: flutter pub get
      - run: flutter build windows --verbose

  optional-libs-linux:
    name: Linux (optional libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: >
          sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
          mpv libmpv-dev dpkg-dev p7zip-full
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build linux --verbose

  optional-libs-macos:
    name: macOS (optional libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build macos --verbose

  optional-libs-ios:
    name: iOS (optional libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build ios --verbose --no-codesign

  optional-libs-android:
    name: Android (optional libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --split-per-abi --verbose

  audio-libs-windows:
    name: Windows (audio libs)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          "C:\Program Files\Git\usr\bin\sed.exe" -i "s/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g" pubspec.yaml
          type pubspec.yaml
        shell: cmd
      - run: flutter pub get
      - run: flutter build windows --verbose
        # TODO(@alexmercerind): package:media_kit_video won't build with package:media_kit_libs_windows_audio due to missing ANGLE headers.
        continue-on-error: true

  audio-libs-linux:
    name: Linux (audio libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: >
          sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev
          mpv libmpv-dev dpkg-dev p7zip-full
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build linux --verbose

  audio-libs-macos:
    name: macOS (audio libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build macos --verbose

  audio-libs-ios:
    name: iOS (audio libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build ios --verbose --no-codesign

  audio-libs-android:
    name: Android (audio libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --split-per-abi --verbose
